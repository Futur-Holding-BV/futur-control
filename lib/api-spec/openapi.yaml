openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: repos
    description: Read-only GitHub repository status
  - name: notifications
    description: Notification settings
  - name: expiry
    description: Upcoming expirations (tokens, certificates, keys, domains)
  - name: actions
    description: Self-heal action log and one-tap proposals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /repos:
    get:
      operationId: listRepos
      tags: [repos]
      summary: List monitored repositories with latest status
      description: Returns one summary per monitored repository in the configured GitHub organization, including latest check status, last push time, last commit title, plain-language failure reason, and any large-file-change anomaly.
      responses:
        "200":
          description: Repository summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepoSummary"
        "502":
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /repos/{name}/detail:
    get:
      operationId: getRepoDetail
      tags: [repos]
      summary: Repository detail with recent checks
      description: Returns the last five check runs for a repository and, when the latest check failed, the first ten error lines plus a link to the full log.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDetail"
        "404":
          description: Repository not found or not monitored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "502":
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /repos/{name}/settings:
    get:
      operationId: getRepoSettings
      tags: [repos]
      summary: Staleness thresholds for one repository
      description: Returns the configured staleness thresholds (in days) for a repository. Defaults are 7 (yellow) and 14 (red) when nothing was configured.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSettings"
        "404":
          description: Repository not found or not monitored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
    put:
      operationId: updateRepoSettings
      tags: [repos]
      summary: Update staleness thresholds for one repository
      description: Stores per-repository staleness thresholds in the database, so a project that is deliberately paused does not raise false alarms.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoSettingsUpdate"
      responses:
        "200":
          description: Saved thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSettings"
        "400":
          description: Invalid thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: Repository not found or not monitored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [push]
      summary: VAPID public key for web-push subscriptions
      responses:
        "200":
          description: Public key and number of registered devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPublicKey"
  /push/subscribe:
    post:
      operationId: subscribePush
      tags: [push]
      summary: Register this device for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOk"
        "400":
          description: Invalid subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [push]
      summary: Remove this device's push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOk"
  /push/test:
    post:
      operationId: sendPushTest
      tags: [push]
      summary: Send a test push notification to all registered devices
      responses:
        "200":
          description: Delivered to at least one device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOk"
        "409":
          description: No device could be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /extern/sleutels:
    get:
      operationId: listLeesSleutels
      tags: [extern]
      summary: List external read-only API keys (names only, never the key value)
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeesSleutelLijst"
    post:
      operationId: createLeesSleutel
      tags: [extern]
      summary: Create a named read-only key; the key value is returned exactly once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeesSleutelAanmaakVerzoek"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeesSleutelAangemaakt"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /extern/sleutels/{naam}:
    delete:
      operationId: deleteLeesSleutel
      tags: [extern]
      summary: Revoke a read-only key without touching the others
      parameters:
        - name: naam
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOk"
        "404":
          description: Unknown key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /notifications/settings:
    get:
      operationId: getNotificationSettings
      tags: [notifications]
      summary: Get notification settings
      description: >
        Read-only. Returns whether Slack notifications are enabled and whether
        a webhook URL is configured. The URL itself is never returned — it is
        set via the SLACK_WEBHOOK_URL environment variable (Replit Secrets).
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
  /notifications/test-mail:
    post:
      operationId: sendTestMail
      tags: [notifications]
      summary: Send a test e-mail via Microsoft Graph
      description: Sends a test e-mail from MAIL_FROM to all MAIL_TO addresses so the operator can verify the mail channel end-to-end.
      responses:
        "200":
          description: Test e-mail accepted by Microsoft Graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOk"
        "409":
          description: Mail is not configured (missing GRAPH_* or MAIL_* settings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "502":
          description: Microsoft Graph refused the token request or the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /notifications/findings:
    get:
      operationId: listFindings
      tags: [notifications]
      summary: List current and recently resolved findings
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
  /notifications/levels:
    get:
      operationId: listFindingLevels
      tags: [notifications]
      summary: List editable delivery levels by finding kind
      responses:
        "200":
          description: Finding levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FindingLevelSetting"
  /notifications/levels/{kind}:
    patch:
      operationId: updateFindingLevel
      tags: [notifications]
      summary: Change the delivery level for a finding kind
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingLevelUpdate"
      responses:
        "200":
          description: Updated level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingLevelSetting"
        "404":
          description: Unknown finding kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /expiry:
    get:
      operationId: listExpiryItems
      tags: [expiry]
      summary: List upcoming expirations
      description: >
        Returns one row per monitored expiring item (GitHub tokens, TLS
        certificates, Azure client key, domain renewals). Items that cannot
        be read are returned with severity "unknown" and a reason — never as ok.
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Expiry items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpiryItem"
  /actions/log:
    get:
      operationId: listActionLog
      tags: [actions]
      summary: Action log of automatic and one-tap actions
      description: Returns the most recent automatic self-heal actions and manually approved actions, newest first.
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionLogEntry"
  /actions/proposals:
    get:
      operationId: listProposals
      tags: [actions]
      summary: List one-tap repair proposals
      description: Proposals the beheercentrum knows how to execute but that require an explicit decision. Nothing is executed until the matching execute endpoint is called.
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
  /actions/proposals/{id}/execute:
    post:
      operationId: executeProposal
      tags: [actions]
      summary: Execute a proposal after explicit user approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Result of the executed action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "404":
          description: Proposal not found (may have become stale)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "502":
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
components:
  schemas:
    ExpiryItem:
      type: object
      required: [id, label, category, severity, consequence]
      properties:
        id:
          type: string
        label:
          type: string
          description: Human-readable name of the expiring item (Dutch)
        category:
          type: string
          enum: [github_token, tls_certificate, azure_key, domain]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        daysLeft:
          type: ["number", "null"]
          description: Whole days until expiry (negative when already expired)
        severity:
          type: string
          enum: [red, orange, ok, unknown]
          description: red = expires within 7 days, orange = within 30 days, ok = later, unknown = could not be read
        consequence:
          type: string
          description: Plain-language description of what breaks when this expires
        unknownReason:
          type: ["string", "null"]
          description: Why the expiry could not be read (only when severity is unknown)
        staleNote:
          type: ["string", "null"]
          description: Set when the expiry date comes from a cached previous reading because RDAP was temporarily unavailable
    ActionLogEntry:
      type: object
      required: [id, action, reason, outcome, createdAt]
      properties:
        id:
          type: number
        action:
          type: string
          description: Plain-language description of what was done
        repo:
          type: ["string", "null"]
        reason:
          type: string
          description: Why the action was taken
        outcome:
          type: string
          description: Plain-language result of the action
        createdAt:
          type: string
          format: date-time
    Proposal:
      type: object
      required: [id, title, description, actionDescription]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          description: Plain-language description of the problem
        actionDescription:
          type: string
          description: Exactly what will happen when the button is pressed
        repo:
          type: ["string", "null"]
    ActionResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
          description: Plain-language outcome message (Dutch)
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PushPublicKey:
      type: object
      required: [publicKey, devices]
      properties:
        publicKey:
          type: string
        devices:
          type: number
    PushSubscribeRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
    PushUnsubscribeRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
    PushOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    LeesSleutelInfo:
      type: object
      required: [naam, aangemaakt]
      properties:
        naam:
          type: string
        aangemaakt:
          type: string
          format: date-time
    LeesSleutelLijst:
      type: object
      required: [sleutels]
      properties:
        sleutels:
          type: array
          items:
            $ref: "#/components/schemas/LeesSleutelInfo"
    LeesSleutelAanmaakVerzoek:
      type: object
      required: [naam]
      properties:
        naam:
          type: string
          description: Name of the connected system (2-64 chars)
    LeesSleutelAangemaakt:
      type: object
      required: [naam, sleutel]
      properties:
        naam:
          type: string
        sleutel:
          type: string
          description: The key value, shown exactly once at creation
    ApiErrorMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    RepoSummary:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [green, yellow, red, gray]
          description: green = latest check succeeded, yellow = code is getting stale (no commits past the yellow threshold), red = check failed or code stale past the red threshold, gray = no check ran or commit information unavailable
        staleReason:
          type: ["string", "null"]
          description: Plain-language explanation when the status was influenced by the staleness check (Dutch)
        lastCommitAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the most recent commit, when available
        lastPushAt:
          type: ["string", "null"]
          format: date-time
        lastCommitTitle:
          type: ["string", "null"]
        failReason:
          type: ["string", "null"]
          description: Plain-language reason when status is red (e.g. "typecheck faalt")
        htmlUrl:
          type: ["string", "null"]
          description: Link to the repository on GitHub
        anomaly:
          oneOf:
            - $ref: "#/components/schemas/AnomalyAlert"
            - type: "null"
        recoveredAfterRetry:
          type: boolean
          description: True when the latest check succeeded only after an automatic retry ("hersteld na herhaling")
    RepoSettings:
      type: object
      required: [repo, staleYellowDays, staleRedDays]
      properties:
        repo:
          type: string
        staleYellowDays:
          type: number
          description: Days without a commit before the repository turns yellow
        staleRedDays:
          type: number
          description: Days without a commit before the repository turns red (uses the existing red notification chain)
    RepoSettingsUpdate:
      type: object
      required: [staleYellowDays, staleRedDays]
      properties:
        staleYellowDays:
          type: number
        staleRedDays:
          type: number
    AnomalyAlert:
      type: object
      required: [commitSha, commitTitle, fileName, linesChanged, commitUrl]
      properties:
        commitSha:
          type: string
        commitTitle:
          type: string
        fileName:
          type: string
        linesChanged:
          type: number
          description: Total lines added plus deleted for the file in this commit
        commitUrl:
          type: string
    CheckRun:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [green, red, gray]
        completedAt:
          type: ["string", "null"]
          format: date-time
        commitTitle:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
          description: Link to the check run on GitHub
    FailedCheckDetail:
      type: object
      required: [name, errorLines, logUrl]
      properties:
        name:
          type: string
        errorLines:
          type: array
          items:
            type: string
          description: First ten error lines from the failed run's log
        logUrl:
          type: string
          description: Link to the full log on GitHub
    RepoDetail:
      type: object
      required: [name, status, checks]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [green, yellow, red, gray]
        staleReason:
          type: ["string", "null"]
          description: Plain-language explanation when the status was influenced by the staleness check (Dutch)
        lastPushAt:
          type: ["string", "null"]
          format: date-time
        lastCommitTitle:
          type: ["string", "null"]
        failReason:
          type: ["string", "null"]
        htmlUrl:
          type: ["string", "null"]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckRun"
        failedCheck:
          oneOf:
            - $ref: "#/components/schemas/FailedCheckDetail"
            - type: "null"
        anomaly:
          oneOf:
            - $ref: "#/components/schemas/AnomalyAlert"
            - type: "null"
        recoveredAfterRetry:
          type: boolean
          description: True when the latest check succeeded only after an automatic retry ("hersteld na herhaling")
    NotificationSettings:
      type: object
      required: [enabled, slackWebhookConfigured, mailConfigured]
      properties:
        enabled:
          type: boolean
          description: Whether Slack notifications are active
        slackWebhookConfigured:
          type: boolean
          description: True when a Slack webhook URL has been saved (URL itself is never returned)
        mailConfigured:
          type: boolean
          description: True when the Microsoft Graph mail settings (GRAPH_* secrets, MAIL_FROM, MAIL_TO) are all present
        updatedAt:
          type: ["string", "null"]
          format: date-time
    Finding:
      type: object
      required: [id, kind, subject, title, detail, level, openedAt, resolvedAt, autoResolved]
      properties:
        id:
          type: string
        kind:
          type: string
        subject:
          type: string
        title:
          type: string
        detail:
          type: string
        level:
          type: string
          enum: [NU, KAN_WACHTEN]
        openedAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        autoResolved:
          type: boolean
    FindingLevelSetting:
      type: object
      required: [kind, level]
      properties:
        kind:
          type: string
        level:
          type: string
          enum: [NU, KAN_WACHTEN]
    FindingLevelUpdate:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [NU, KAN_WACHTEN]
